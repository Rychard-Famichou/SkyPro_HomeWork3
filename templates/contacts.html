<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop demo</title>
    <link href="css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-2 bg-black text-white vh-100 d-flex flex-column p-3">
            <h2 class="mb-4"><span class="badge text-black bg-white me-3">B</span>Меню</h2>
            <nav class="nav flex-column nav-pills">
                <a class="nav-link text-white" href="index">Главная</a>
                <a class="nav-link text-white" href="catalog">Категории</a>
                <a class="nav-link text-white" href="orders">Заказы</a>
                <a class="nav-link active" aria-current="page">Контакты</a>
            </nav>
            <div class="dropup mt-auto mb-3">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                   id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <strong><img src="../img/album_rick_astley.jpg" class="rounded-circle me-3" alt="Аватар" width="40" height="40">Пользователь</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="profile">Профиль</a></li>
                    <li><a class="dropdown-item" href="settings">Настройки</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="#">Выйти</a></li>
                </ul>
            </div>
        </div>
        <div class="col-10 mt-5">
            <div class="row text-center">
                <h2>Контакты</h2>
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="card m-5 p-3">
                        <form>
                            <div class="mb-3">
                                <label for="InputName" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="InputName">
                            </div>
                            <div class="mb-3">
                                <label for="InputEmail" class="form-label">Почта</label>
                                <div class="input-group">
                                    <span class="input-group-text" id="basic-addon1">@</span>
                                    <input type="email" class="form-control" id="InputEmail"
                                           aria-describedby="basic-addon3 basic-addon4">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="InputText" class="form-label">Сообщение</label>
                                <textarea class="form-control" id="InputText" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary mb-3">Отправить</button>
                        </form>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card m-5 p-3 border border-0">
                        <h4 class="mb-3">Наши контакты</h4>
                        <p>Здесь будут наши контакты.</p>
                        <p>Здесь будут наши контакты.</p>
                        <p>Здесь будут наши контакты.</p>
                        <p>Здесь будут наши контакты.</p>
                        <p>Здесь будут наши контакты.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
